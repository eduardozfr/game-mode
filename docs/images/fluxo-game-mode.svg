<text x="925" y="249" font-size="16" font-weight="700" fill="#DC4349" text-anchor="middle">Não</text>
<path d="M1091 211 V178 H496 V211" fill="none" stroke="#73879A" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M773 343 V383" fill="none" stroke="#16A34A" stroke-width="3" marker-end="url(#arrow-green)"/>
<text x="801" y="367" font-size="17" font-weight="700" fill="#16A34A" text-anchor="start">Sim</text>
<rect x="505" y="390" width="537" height="75" rx="16" fill="#F5F9FF" stroke="#3B82F6" stroke-width="2"/>
<text x="773" y="420" font-size="19" font-weight="700" fill="#142744" text-anchor="middle">3. Carregar perfil do jogo</text>
<text x="773" y="448" font-size="16" font-weight="500" fill="#465E77" text-anchor="middle">CS2 · Red Dead Redemption 2 · Flight Simulator 2024</text>

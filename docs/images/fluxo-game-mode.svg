<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1220" viewBox="0 0 1280 1220" role="img" aria-labelledby="chartTitle chartDesc">
<title id="chartTitle">Game Mode — Fluxo de funcionamento (0.1.0)</title>
<desc id="chartDesc">Monitor do Windows detecta o jogo, salva estado, analisa processos sem encerrá-los, aplica ajustes reversíveis e restaura as configurações quando o jogo termina.</desc>
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#73879A" stroke-width="1.6"/></marker>
  <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#16A34A" stroke-width="1.6"/></marker>
  <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#DC4349" stroke-width="1.6"/></marker>
</defs>
<rect x="0" y="0" width="1280" height="1220" fill="#FFFFFF"/>
<rect x="24" y="20" width="1232" height="1154" rx="24" fill="#FBFDFF" stroke="#E2E8F0"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="640" y="71" font-size="40" font-weight="750" fill="#142744" text-anchor="middle">Game Mode</text>
<text x="640" y="106" font-size="22" font-weight="500" fill="#62768B" text-anchor="middle">Fluxo de funcionamento · 0.1.0</text>
<text x="640" y="140" font-size="17" font-weight="400" fill="#64748B" text-anchor="middle">Monitor automático · scanner contextual · restauração reversível</text>
<rect x="45" y="211" width="263" height="102" rx="16" fill="#F5F9FF" stroke="#3B82F6" stroke-width="2"/>
<text x="176" y="245" font-size="19" font-weight="700" fill="#142744" text-anchor="middle">1. Inicialização</text>
<text x="176" y="273" font-size="17" font-weight="500" fill="#465E77" text-anchor="middle">Logon do usuário</text>
<text x="176" y="297" font-size="17" font-weight="500" fill="#465E77" text-anchor="middle">no Windows</text>
<rect x="365" y="211" width="263" height="102" rx="16" fill="#F5F9FF" stroke="#3B82F6" stroke-width="2"/>
<text x="496" y="245" font-size="19" font-weight="700" fill="#142744" text-anchor="middle">2. Monitor ativo</text>
<text x="496" y="273" font-size="17" font-weight="500" fill="#465E77" text-anchor="middle">Observa processos</text>
<text x="496" y="297" font-size="17" font-weight="500" fill="#465E77" text-anchor="middle">de jogos conhecidos</text>
<path d="M308 262 H365" fill="none" stroke="#73879A" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M648 262 L773 181 L898 262 L773 343 Z" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
<path d="M628 262 H648" fill="none" stroke="#73879A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="773" y="239" font-size="18" font-weight="700" fill="#142744" text-anchor="middle">Jogo reconhecido</text>
<text x="773" y="266" font-size="18" font-weight="700" fill="#142744" text-anchor="middle">em execução?</text>
<rect x="957" y="211" width="268" height="102" rx="16" fill="#F8FAFC" stroke="#9AAABC" stroke-width="2"/>
<text x="1091" y="245" font-size="19" font-weight="700" fill="#142744" text-anchor="middle">Aguardar</text>
<text x="1091" y="272" font-size="16" font-weight="500" fill="#465E77" text-anchor="middle">Continuar monitorando</text>
<text x="1091" y="295" font-size="16" font-weight="500" fill="#465E77" text-anchor="middle">em segundo plano</text>

name: Validate Game Mode
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate PowerShell and JSON
        shell: powershell
        run: .\scripts\SelfTest.ps1
      - name: Run Python tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
